openapi: 3.0.3
info:
  title: KavoraX API
  description: Backend REST APIs for KavoraX admin panel and public site
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: http://localhost:8080/api
    description: Public/Health endpoints

paths:
  /health:
    get:
      summary: Get application health status
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /health/database:
    get:
      summary: Get database connection health status
      operationId: getDatabaseHealth
      tags:
        - System
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
        '503':
          description: Service Unavailable

  /enquiries:
    post:
      summary: Submit a new enquiry
      operationId: submitEnquiry
      tags:
        - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryRequest'
      responses:
        '201':
          description: Enquiry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enquiry'
        '400':
          description: Validation error

  /demo-requests:
    post:
      summary: Submit a new demo request
      operationId: submitDemoRequest
      tags:
        - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRequestDto'
      responses:
        '201':
          description: Demo request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequest'
        '400':
          description: Validation error

components:
  schemas:
    EnquiryRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        subject:
          type: string
        message:
          type: string

    Enquiry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    DemoRequestDto:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        requirements:
          type: string

    DemoRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        company:
          type: string
        requirements:
          type: string
        createdAt:
          type: string
          format: date-time
